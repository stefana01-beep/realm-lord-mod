name: Build mod jar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee build.log

      - name: In-game tests
        run: |
          set -o pipefail
          echo "==== GAME TESTS ====" >> build.log
          timeout 900 ./gradlew runGameTestServer --no-daemon 2>&1 | tee -a build.log
          if grep -E "Couldn't parse element|Failed to load .*realmlord|Couldn't load .*realmlord|Missing .*realmlord|Failed to load registries|Failed to load datapacks" build.log; then
            echo "Data files failed to load"; exit 1
          fi
          grep -E "All [0-9]+ required tests passed" build.log || { echo "Game tests did not all pass"; exit 1; }

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: realmlord-mod-jar
          path: build/libs/*.jar

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Realm Lord build ${{ github.run_number }}
          body: |
            Automatic build of commit ${{ github.sha }}.
            Download the .jar below and drop it in your mods folder (Forge 1.20.1).
          files: build/libs/*.jar
          make_latest: true

      - name: Publish build log
        if: always()
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          cp build.log /tmp/build.log || echo "no log" > /tmp/build.log
          git fetch origin ci-log || true
          git checkout --orphan ci-log-tmp
          git rm -rf --cached . > /dev/null
          cp /tmp/build.log build.log
          git add -f build.log
          git commit -m "Build log for ${GITHUB_SHA} (${{ job.status }})"
          git push -f origin ci-log-tmp:ci-log
